[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-kid-os-backend"
version = "0.1.0"
description = "Aegis-Kid OS (India Edition) MVP - Central Watchdog, AI Adjudicator & Parent Alert Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.117",
    "uvicorn[standard]>=0.30,<0.32",
    "pydantic>=2.9,<3",
    "python-dotenv>=1.0,<2",
    "PyNaCl>=1.5,<2",
    "httpx>=0.27,<0.29",
    "python-jose[cryptography]>=3.3,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "httpx>=0.27,<0.29"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
